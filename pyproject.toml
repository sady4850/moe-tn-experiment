[project]
name = "moe-tn-experiment"
version = "0.1.0"
description = "Controlled test of effective-rank signals for MoE expert merging"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0,<5",
  "numpy>=1.26,<3",
  "pyyaml>=6.0,<7",
  "torch>=2.4,<3",
  "tqdm>=4.66,<5",
  "transformers==5.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
eval = ["lm-eval[hf]==0.4.13", "scipy>=1.11"]

[project.scripts]
moe-tn = "moe_tn.run:main"
moe-tn-combine = "moe_tn.combined:main"
moe-tn-compress = "moe_tn.compression_run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moe_tn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
